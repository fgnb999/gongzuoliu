name: danmu-api

permissions:
    contents: write

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest

        steps:
            - name: Checkout target repo
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: Sync from private upstream
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                
                # 私有仓库地址：fgnb999/danmu_api
                git remote add upstream https://${{ secrets.UPSTREAM_PAT }}@github.com/fgnb999/danmu_api.git
                git fetch upstream main
                git checkout main
                git merge upstream/main --allow-unrelated-histories -m "Sync from private upstream: fgnb999/danmu_api"
                git push origin main

            - name: Check for Failure
              if: failure()
              run: |
                  echo "[Error] Sync failed."
                  exit 1
